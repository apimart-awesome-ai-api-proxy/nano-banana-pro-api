name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Attribution and pricing data check
        run: python tools/check_links.py
      - name: Check examples offline (no API calls)
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile examples/python_generate.py tools/check_links.py tools/snapshot.py
          node --check examples/javascript.mjs
          bash -n examples/curl.sh
